name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set ANDROID_HOME environment variable
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean
          git checkout android/app/build.gradle || true
          node -e '
            const fs = require("fs");
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            if (!bg.includes("release.keystore")) {
              bg = bg.replace("signingConfigs {", "signingConfigs {\n        release {\n            storeFile file(\x27release.keystore\x27)\n            storePassword \x27zeeu2026release\x27\n            keyAlias \x27zeeu-key\x27\n            keyPassword \x27zeeu2026release\x27\n        }");
              bg = bg.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release");
              fs.writeFileSync("android/app/build.gradle", bg);
            }
          '

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -storepass "zeeu2026release" \
            -keypass "zeeu2026release" \
            -keystore android/app/release.keystore \
            -alias "zeeu-key" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ZeeU, OU=Production, O=ZeeU Creative Studio, L=Karachi, S=Sindh, C=PK"

      - name: Build Local APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
